# Real-corpus semiconductor relevance annotation pilot (offline synthetic path).
#
# Requires NO credentials, network, BigQuery, Alpaca, GPU, or models.
# Default paths point at committed synthetic fixtures for software validation.
# Replace articles_path / provenance_path with a rights-cleared local corpus
# for a real pilot. Do not commit private article bodies.
#
#   python3 -m trading_platform \
#     configs/research/semiconductor_relevance_real_corpus_pilot_local.yaml \
#     --run-id semiconductor_relevance_real_corpus_pilot_local
#
# This phase does not implement language models, sentiment, return prediction,
# or production trading changes.

name: semiconductor_relevance_real_corpus_pilot_local

pipeline:
  strategy:
    type: run_semiconductor_relevance_real_corpus_pilot

    articles_path: "tests/fixtures/research/relevance_pilot/articles.jsonl"
    provenance_path: "tests/fixtures/research/relevance_pilot/provenance.jsonl"
    default_content_source: "synthetic_fixture"

    sampling_seed: "semiconductor-relevance-pilot-v1"

    # Offline fixture overrides: full planning targets exceed the tiny synthetic N.
    # Production real-corpus runs should omit these overrides and honor the plan.
    representative_sample_size_override: 16
    challenge_sample_size_override: 10
    calibration_sample_size_override: 8
    formal_double_annotation_override: 10
    duplicate_candidate_target_override: 10
    duplicate_below_threshold_override: 10
    bootstrap_replicates: 50

    near_title_threshold: 0.8
    near_body_threshold: 0.7
    near_max_publication_distance_hours: 720
    near_shingle_size: 3

    eligibility:
      permitted_languages: ["en"]
      metadata_only_eligible: true
      undated_eligible: false
      retrieval_failed_eligible: false
      require_provenance: true
      require_source_url: true
      require_exact_cluster_canonical: true
      minimum_title_length: 8
      minimum_available_text_length: 40

    real_content_controls:
      allow_full_body_in_run_artifacts: false
      allow_full_body_in_annotation_batch: true
      annotation_batch_output_is_local_only: true
      allow_real_content_in_git_tracked_paths: false
      maximum_report_excerpt_characters: 280

    pilot_design:
      confidence_level: 0.95
      apply_finite_population_correction: true
      metric_denominator_half_width: 0.10

      representative_sample:
        target_prevalence_half_width: 0.07
        planning_prevalence_scenarios: [0.10, 0.25, 0.50, 0.75]
        round_up_to: 10
        unusable_record_reserve_fraction: 0.10

      challenge_sample:
        target_count: 100
        inferential_use: false

      annotation_calibration:
        target_count: 40
        double_annotate_all: true
        excluded_from_formal_benchmark: true

      formal_double_annotation:
        target_count: 120
        planning_status: operational_default_not_universal

      duplicate_pair_review:
        candidate_target_count: 200
        below_threshold_audit_target_count: 100

    duplicate_threshold_grid: [0.50, 0.55, 0.60, 0.65, 0.68, 0.70, 0.75, 0.80, 0.85, 0.90]

    # Calibration inputs (synthetic fixtures for offline validation).
    calibration_raw_annotations_path: "tests/fixtures/research/relevance_pilot/calibration_raw_annotations.jsonl"
    calibration_decision_path: "tests/fixtures/research/relevance_pilot/calibration_decision.json"

    # Formal pilot gate — required exact string.
    calibration_approval: "ENABLE_FORMAL_PILOT"

    formal_raw_annotations_path: "tests/fixtures/research/relevance_pilot/formal_raw_annotations.jsonl"
    formal_adjudicated_annotations_path: "tests/fixtures/research/relevance_pilot/formal_adjudicated_annotations.jsonl"
    duplicate_pair_reviews_path: "tests/fixtures/research/relevance_pilot/duplicate_pair_reviews.jsonl"

    # Final benchmark construction requires exact typed human approval.
    # Omit or leave unset for highest status REVIEW_REQUIRED.
    # pilot_human_approval: "APPROVE_FINAL_BENCHMARK_CONSTRUCTION"
