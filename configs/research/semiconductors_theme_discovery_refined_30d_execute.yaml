name: semiconductors_theme_discovery_refined_30d_execute

# Refined semiconductor theme DISCOVERY / debug — real BigQuery execution.
#
# Run ONLY after the dry-run (semiconductors_theme_discovery_refined_30d_dryrun)
# estimate looks safe. Even with execute_query: "ENABLE", the SafeBigQueryClient
# ALWAYS dry-runs first and enforces maximum_bytes_billed + the cost policy before
# any billable query.
#
# Writes theme_discovery.csv / theme_discovery.jsonl for HUMAN review. Do NOT add
# any returned code to the semiconductors bundle without review. If it returns
# zero themes, use the SEEDED record-based discovery instead of broadening
# substring patterns. Distinct query_name / run-id so the 90-day artifacts are
# preserved.

providers:
  bigquery:
    project_id: "YOUR_PROJECT_ID"
    table: "gdelt-bq.gdeltv2.gkg_partitioned"

pipeline:
  ingest:
    source: bigquery_gdelt_theme_discovery
    query_name: semiconductors_theme_discovery_refined_30d_partition
    topic: semiconductors

    match_mode: token

    theme_search_patterns:
      - semiconductor
      - semiconductors
      - microelectronics
      - microprocessor
      - microprocessors
      - integrated_circuit
      - integrated_circuits
      - silicon_chip
      - computer_chip
      - chipmaker
      - chipmakers
      - chip_manufacturing
      - wafer_fabrication
      - photolithography
      - fabless

    known_rejected_theme_codes:
      - "TAX_FNCACT_FOUNDRYMAN"

    partition_filter:
      enabled: true
      column: "_PARTITIONTIME"
      type: "timestamp"

    window:
      preset: last_30_days
      bucket: 1d

    limit: 200

    cost_controls:
      dry_run: false
      # Typed execution gate: a billable query runs only when execute_query is the
      # literal "ENABLE" AND the internal dry-run estimate is within budget.
      execute_query: "ENABLE"
      # ~30 days of theme-exploded GKG scans ~9 GiB (~$0.055). This cap (~14 GiB)
      # sits above that estimate but well below single_query_cap_usd ($0.20).
      maximum_bytes_billed: 15000000000
      cost_policy_path: "configs/cost_policy.yaml"
      ledger_path: "data/cost/cost_ledger.jsonl"
      # Discovery must reflect the themes actually present in the window; a stale
      # cache would defeat that, so caching is disabled here by default.
      use_cache: false
