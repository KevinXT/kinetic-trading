name: semiconductors_bigquery_1y_partition_dryrun

# 1-year semiconductor BigQuery historical GDELT daily counts — DRY-RUN (safe).
#
# Measures the declared study window 2025-07-01 .. 2026-06-30 (inclusive) at a
# daily bucket. Uses _PARTITIONTIME partition pruning so only the requested days
# are scanned. This estimates scanned bytes/cost and logs a ledger decision; it
# does NOT run a billable query and fetches no data. Inspect the dry-run estimate
# before running the execute config.
#
# NOTE: this references the `semiconductors` theme bundle, which is a PLACEHOLDER
# until a human reviews theme discovery and fills in the validated codes. Until
# then this config fails clearly at query build (by design).

providers:
  bigquery:
    project_id: "YOUR_PROJECT_ID"
    table: "gdelt-bq.gdeltv2.gkg_partitioned"

pipeline:
  ingest:
    source: bigquery_gdelt_counts
    query_name: semiconductors_bigquery_1y_partition
    topic: semiconductors
    theme_bundle: semiconductors

    search_columns:
      - V2Themes

    partition_filter:
      enabled: true
      column: "_PARTITIONTIME"
      type: "timestamp"

    window:
      start: "2025-07-01"
      end: "2026-06-30"
      bucket: 1d

    cost_controls:
      dry_run: true
      maximum_bytes_billed: 60000000000
      execute_query: ""
      cost_policy_path: "configs/cost_policy.yaml"
      ledger_path: "data/cost/cost_ledger.jsonl"
      use_cache: true
