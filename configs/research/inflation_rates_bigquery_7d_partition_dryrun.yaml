name: inflation_rates_bigquery_7d_partition_dryrun

# Lowest-cost BigQuery historical GDELT counts — DRY-RUN (default, safe).
#
# Builds on the V2Themes-only config by also enabling partition pruning. The
# DATE column on gkg_partitioned is an ordinary field and does NOT prune
# partitions, so a DATE-only filter still scans the entire table (~TiB). The
# table is partitioned by _PARTITIONTIME; constraining that pseudo-column is
# what actually limits bytes scanned to just the requested days.
#
# It estimates scanned bytes/cost and logs a ledger decision; it does NOT run a
# billable query and fetches no data. Set project_id to your real GCP project.

providers:
  bigquery:
    project_id: "YOUR_PROJECT_ID"
    table: "gdelt-bq.gdeltv2.gkg_partitioned"

pipeline:
  ingest:
    source: bigquery_gdelt_counts
    query_name: inflation_rates_bigquery_7d_partition
    topic: inflation_rates

    # Only scan the compact theme column to keep bytes scanned low.
    search_columns:
      - V2Themes

    # Match a GDELT theme code rather than broad free-text phrases.
    query_terms:
      - ECON_INFLATION

    # Prune partitions so only the requested days are scanned.
    partition_filter:
      enabled: true
      column: "_PARTITIONTIME"
      type: "timestamp"

    window:
      preset: last_7_days
      bucket: 1d

    cost_controls:
      dry_run: true
      maximum_bytes_billed: 5000000000
      execute_query: ""
      cost_policy_path: "configs/cost_policy.yaml"
      ledger_path: "data/cost/cost_ledger.jsonl"
      use_cache: true
