name: inflation_rates_bigquery_30d_partition_dryrun
providers:
  bigquery:
    project_id: YOUR_PROJECT_ID
    table: gdelt-bq.gdeltv2.gkg_partitioned
pipeline:
  steps:
  - task: news.gdelt.bigquery.fetch_daily_counts
    params:
      query_name: inflation_rates_bigquery_30d_partition
      topic: inflation_rates
      search_columns:
      - V2Themes
      query_terms:
      - ECON_INFLATION
      partition_filter:
        enabled: true
        column: _PARTITIONTIME
        type: timestamp
      window:
        preset: last_30_days
        bucket: 1d
      cost_controls:
        dry_run: true
        maximum_bytes_billed: 12000000000
        execute_query: ''
        cost_policy_path: configs/cost_policy.yaml
        ledger_path: warehouse/cost/cost_ledger.jsonl
        use_cache: true
