name: inflation_rates_bigquery_30d_partition_dryrun

# Normal 30-day BigQuery historical GDELT counts — DRY-RUN (default, safe).
#
# Uses _PARTITIONTIME partition pruning so only the requested days are scanned.
# The DATE column on gkg_partitioned is an ordinary field and does NOT prune
# partitions; constraining _PARTITIONTIME is what keeps bytes scanned (and cost)
# bounded. A 10 GB cap is used here because 30 days may estimate higher than the
# ~2 GiB 7-day query. It estimates scanned bytes/cost and logs a ledger decision;
# it does NOT run a billable query and fetches no data.

providers:
  bigquery:
    project_id: "YOUR_PROJECT_ID"
    table: "gdelt-bq.gdeltv2.gkg_partitioned"

pipeline:
  ingest:
    source: bigquery_gdelt_counts
    query_name: inflation_rates_bigquery_30d_partition
    topic: inflation_rates

    search_columns:
      - V2Themes

    query_terms:
      - ECON_INFLATION

    partition_filter:
      enabled: true
      column: "_PARTITIONTIME"
      type: "timestamp"

    window:
      preset: last_30_days
      bucket: 1d

    cost_controls:
      dry_run: true
      maximum_bytes_billed: 12000000000
      execute_query: ""
      cost_policy_path: "configs/cost_policy.yaml"
      ledger_path: "data/cost/cost_ledger.jsonl"
      use_cache: true
