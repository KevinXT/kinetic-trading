name: semiconductors_alpaca_bars

# Alpaca daily bars for the semiconductor attention study.
#
# Fetches AMD, NVDA, SMH (instruments) and QQQ (benchmark) over a window that
# extends before and after the declared news study window so prior-session and
# S..S+4 forward-target bars are available:
#   study news window : 2025-07-01 .. 2026-06-30
#   market bar window : 2025-05-15 .. 2026-07-10  (extra history + target tail)
#
# Credentials are read from environment variables only (never in config):
#   ALPACA_API_KEY_ID, ALPACA_API_SECRET_KEY
#
# Homogeneous bar identity is enforced downstream: single provider (alpaca), feed
# (iex), adjustment (all), currency (USD), timeframe (1Day). The research build
# (semiconductors_news_market_study_v1) additionally fails if any of the four
# required symbols is absent (require_symbols).

providers:
  market:
    alpaca:
      base_url: "https://data.alpaca.markets"
      key_id_env: "ALPACA_API_KEY_ID"
      secret_key_env: "ALPACA_API_SECRET_KEY"
      timeout_seconds: 30
      maximum_attempts: 4
      initial_backoff_seconds: 1
      maximum_backoff_seconds: 30
      maximum_pages: 100

cache:
  # Window ends on a completed historical interval, so no TTL is required.
  ttl_seconds: null
  force_refresh: false
  # v2 cache keys include normalized api_origin (sandbox vs production isolation).
  schema_version: "alpaca-bars-v2"

storage:
  type: jsonl
  root: "data/processed/market"

pipeline:
  ingest:
    source: alpaca_historical_bars
    provider: alpaca
    request:
      symbols:
        - AMD
        - NVDA
        - SMH
        - QQQ
      timeframe: "1Day"
      start: "2025-05-15T00:00:00Z"
      end: "2026-07-10T23:59:59Z"
      feed: iex
      adjustment: all
      limit: 10000
      sort: asc
      currency: USD
