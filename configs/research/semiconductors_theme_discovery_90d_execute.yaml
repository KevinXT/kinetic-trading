name: semiconductors_theme_discovery_90d_execute

# Semiconductor theme DISCOVERY / debug — real BigQuery execution.
#
# Run this ONLY after the dry-run estimate (semiconductors_theme_discovery_90d_dryrun)
# looks safe. Even with execute_query: "ENABLE", the SafeBigQueryClient ALWAYS
# dry-runs first and enforces maximum_bytes_billed + the cost policy before any
# billable query.
#
# Writes theme_discovery.csv / theme_discovery.jsonl with the actual GDELT theme
# codes (and counts) seen in the window. A HUMAN must then review that file and
# populate the `semiconductors` bundle in configs/gdelt_theme_bundles.yaml with the
# selected, validated codes (recording the source discovery run id).
#
# Uses _PARTITIONTIME partition pruning so only the requested days are scanned.

providers:
  bigquery:
    project_id: "YOUR_PROJECT_ID"
    table: "gdelt-bq.gdeltv2.gkg_partitioned"

pipeline:
  ingest:
    source: bigquery_gdelt_theme_discovery
    query_name: semiconductors_theme_discovery_90d_partition
    topic: semiconductors

    # match_mode: token — a pattern matches only a whole `_`-delimited segment of
    # a normalized theme code, so `foundry` can no longer match the occupation
    # theme TAX_FNCACT_FOUNDRYMAN. The FIRST live 90-day run used the historical
    # substring mode with a bare `foundry` pattern (removed below) and returned
    # only that false positive (recorded in the semiconductors bundle).
    match_mode: token

    # Targeted, semiconductor-specific patterns only. The bare terms `foundry`,
    # `wafer`, and `lithography` were REMOVED: as standalone substrings they match
    # occupations/materials unrelated to chips (foundry -> FOUNDRYMAN). Multi-token
    # `wafer_fabrication` / `photolithography` are safe under token matching.
    theme_search_patterns:
      - semiconductor
      - semiconductors
      - microelectronics
      - microprocessor
      - microprocessors
      - integrated_circuit
      - integrated_circuits
      - silicon_chip
      - computer_chip
      - chipmaker
      - chipmakers
      - chip_manufacturing
      - wafer_fabrication
      - photolithography
      - fabless

    # Codes already reviewed and rejected as false positives. If any reappears it
    # is surfaced in bigquery_summary.json as rejected_known_false_positive.
    known_rejected_theme_codes:
      - "TAX_FNCACT_FOUNDRYMAN"

    partition_filter:
      enabled: true
      column: "_PARTITIONTIME"
      type: "timestamp"

    window:
      preset: last_90_days
      bucket: 1d

    limit: 200

    cost_controls:
      dry_run: false
      # Typed execution gate: the SafeBigQueryClient only runs a billable query
      # when execute_query == "ENABLE" AND the dry-run estimate is within budget.
      execute_query: "ENABLE"
      # 90 days of theme-exploded GKG scans ~27 GiB (~$0.16 at $6.25/TiB). This cap
      # (~29.8 GiB) sits above that estimate but still below the cost policy's
      # single_query_cap_usd ($0.20 ≈ 32.8 GiB), which remains the hard backstop.
      maximum_bytes_billed: 32000000000
      cost_policy_path: "configs/cost_policy.yaml"
      ledger_path: "data/cost/cost_ledger.jsonl"
      # Discovery must reflect the themes actually present in the window; a stale
      # cache would defeat that, so caching is disabled here by default.
      use_cache: false
