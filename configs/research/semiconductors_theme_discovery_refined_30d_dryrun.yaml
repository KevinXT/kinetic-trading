name: semiconductors_theme_discovery_refined_30d_dryrun

# Refined semiconductor theme DISCOVERY / debug — DRY-RUN (default, safe).
#
# A cheaper, safer second pass after the first 90-day live run returned only the
# false positive TAX_FNCACT_FOUNDRYMAN (recorded in configs/gdelt_theme_bundles.yaml).
# Changes vs the 90-day run:
#   - match_mode: token       -> `foundry` can no longer match `FOUNDRYMAN`.
#   - targeted pattern set    -> bare foundry/wafer/lithography removed.
#   - last_30_days window     -> ~1/3 the bytes of the 90-day scan.
# Distinct query_name / run-id so the previous 90-day artifacts are NOT overwritten.
#
# It estimates scanned bytes/cost and logs a ledger decision; it does NOT run a
# billable query and fetches no data. If discovery returns zero themes, use the
# SEEDED record-based discovery (semiconductors_seeded_theme_discovery_30d_*)
# rather than broadening substring patterns.

providers:
  bigquery:
    project_id: "YOUR_PROJECT_ID"
    table: "gdelt-bq.gdeltv2.gkg_partitioned"

pipeline:
  ingest:
    source: bigquery_gdelt_theme_discovery
    query_name: semiconductors_theme_discovery_refined_30d_partition
    topic: semiconductors

    match_mode: token

    theme_search_patterns:
      - semiconductor
      - semiconductors
      - microelectronics
      - microprocessor
      - microprocessors
      - integrated_circuit
      - integrated_circuits
      - silicon_chip
      - computer_chip
      - chipmaker
      - chipmakers
      - chip_manufacturing
      - wafer_fabrication
      - photolithography
      - fabless

    known_rejected_theme_codes:
      - "TAX_FNCACT_FOUNDRYMAN"

    partition_filter:
      enabled: true
      column: "_PARTITIONTIME"
      type: "timestamp"

    window:
      preset: last_30_days
      bucket: 1d

    limit: 200

    cost_controls:
      dry_run: true
      # ~30 days of theme-exploded GKG scans ~9 GiB (~$0.055). This cap (~14 GiB)
      # sits above that estimate but well below single_query_cap_usd ($0.20).
      maximum_bytes_billed: 15000000000
      execute_query: ""
      cost_policy_path: "configs/cost_policy.yaml"
      ledger_path: "data/cost/cost_ledger.jsonl"
      # Discovery must reflect the CURRENT window; a stale cache hit would skip the
      # fresh estimate, so caching is disabled here by default.
      use_cache: false
