name: semiconductors_theme_discovery_90d_dryrun

# Semiconductor theme DISCOVERY / debug — DRY-RUN (default, safe).
#
# Lists which actual GDELT theme codes appear in the last 90 days whose text
# matches semiconductor-related patterns, with per-theme counts. Use this to learn
# what GDELT actually contains, then a HUMAN reviews theme_discovery.csv and
# populates the `semiconductors` bundle in configs/gdelt_theme_bundles.yaml.
#
# Uses _PARTITIONTIME partition pruning so only the requested days are scanned.
# It estimates scanned bytes/cost and logs a ledger decision; it does NOT run a
# billable query and fetches no data. Do NOT commit guessed theme codes as
# validated — only codes seen in real discovery output should enter the bundle.

providers:
  bigquery:
    project_id: "YOUR_PROJECT_ID"
    table: "gdelt-bq.gdeltv2.gkg_partitioned"

pipeline:
  ingest:
    source: bigquery_gdelt_theme_discovery
    query_name: semiconductors_theme_discovery_90d_partition
    topic: semiconductors

    # match_mode: token — a pattern matches only a whole `_`-delimited segment of
    # a normalized theme code, so `foundry` can no longer match the occupation
    # theme TAX_FNCACT_FOUNDRYMAN. The FIRST live 90-day run used the historical
    # substring mode with a bare `foundry` pattern (removed below) and returned
    # only that false positive (recorded in the semiconductors bundle).
    match_mode: token

    # Targeted, semiconductor-specific patterns only. The bare terms `foundry`,
    # `wafer`, and `lithography` were REMOVED: as standalone substrings they match
    # occupations/materials unrelated to chips (foundry -> FOUNDRYMAN). Multi-token
    # `wafer_fabrication` / `photolithography` are safe under token matching.
    theme_search_patterns:
      - semiconductor
      - semiconductors
      - microelectronics
      - microprocessor
      - microprocessors
      - integrated_circuit
      - integrated_circuits
      - silicon_chip
      - computer_chip
      - chipmaker
      - chipmakers
      - chip_manufacturing
      - wafer_fabrication
      - photolithography
      - fabless

    # Codes already reviewed and rejected as false positives. If any reappears it
    # is surfaced in bigquery_summary.json as rejected_known_false_positive.
    known_rejected_theme_codes:
      - "TAX_FNCACT_FOUNDRYMAN"

    partition_filter:
      enabled: true
      column: "_PARTITIONTIME"
      type: "timestamp"

    window:
      preset: last_90_days
      bucket: 1d

    limit: 200

    cost_controls:
      dry_run: true
      # ~90 days of theme-exploded GKG scans ~27 GiB (~$0.16). This cap (~29.8 GiB)
      # is set to match the execute config so the dry-run note does not report a
      # would-be block; it stays below single_query_cap_usd ($0.20 ≈ 32.8 GiB).
      maximum_bytes_billed: 32000000000
      execute_query: ""
      cost_policy_path: "configs/cost_policy.yaml"
      ledger_path: "data/cost/cost_ledger.jsonl"
      # Discovery is a DEBUG path: its purpose is to inspect the CURRENT SQL and
      # dry-run estimate. A stale cache hit would skip the fresh estimate, so
      # caching is disabled here by default.
      use_cache: false
