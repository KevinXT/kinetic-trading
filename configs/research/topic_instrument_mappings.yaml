# Versioned topic -> instrument research mappings.
#
# These are RESEARCHER-DEFINED assumptions, not objective truth. They are
# versioned so a later revision does not silently rewrite history. A present-day
# ticker list is NOT a survivorship-bias-free historical universe: instruments
# that were delisted or renamed are not represented, which biases any analysis
# toward survivors. Keep this list small and defensible rather than speculative.
# `instrument_id` is the durable internal identity. `symbol` is a date-valid
# market identifier, not a permanent identity; valid_from/valid_to jointly bound
# the research relationship and symbol assignment. Null windows are a V1
# simplification and do not remove ticker-change or survivorship risk.

