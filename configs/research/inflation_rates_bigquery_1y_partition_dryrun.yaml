name: inflation_rates_bigquery_1y_partition_dryrun

# 1-year BigQuery historical GDELT counts — DRY-RUN (default, safe).
#
# Uses _PARTITIONTIME partition pruning so only the requested days are scanned.
# A wider window scans more data, so a 50 GB cap is used as a starting dry-run
# ceiling. Inspect the dry-run estimate before adding any 1-year execute config.
# It estimates scanned bytes/cost and logs a ledger decision; it does NOT run a
# billable query and fetches no data.

providers:
  bigquery:
    project_id: "YOUR_PROJECT_ID"
    table: "gdelt-bq.gdeltv2.gkg_partitioned"

pipeline:
  ingest:
    source: bigquery_gdelt_counts
    query_name: inflation_rates_bigquery_1y_partition
    topic: inflation_rates

    search_columns:
      - V2Themes

    query_terms:
      - ECON_INFLATION

    partition_filter:
      enabled: true
      column: "_PARTITIONTIME"
      type: "timestamp"

    window:
      preset: last_1_year
      bucket: 1d

    cost_controls:
      dry_run: true
      maximum_bytes_billed: 50000000000
      execute_query: ""
      cost_policy_path: "configs/cost_policy.yaml"
      ledger_path: "data/cost/cost_ledger.jsonl"
      use_cache: true
