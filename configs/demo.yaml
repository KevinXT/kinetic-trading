name: demo

providers:
  news:
    gdelt:
      timeout_s: 30
      doc:
        base_url: "https://api.gdeltproject.org/api/v2/doc/doc"
        mode: "artlist"
        format: "json"
        timespan: "24h"
        maxrecords: 10
        sort: "datedesc"

pipeline:
  ingest:
    source: gdelt_docs
    query: "artificial intelligence"
    max_records: 10

  transform:
    - type: filter_articles
      language: "English"
      source_country: "United States"
    - type: dedupe_articles
      by: ["url", "title"]
    - type: tag_articles
    - type: aggregate_article_features
    - type: store_features
    - type: store_articles
      output_path: "data/processed/articles/articles.jsonl"