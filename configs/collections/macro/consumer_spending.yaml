name: consumer-spending
providers:
  news:
    gdelt:
      timeout_s: 30
      doc:
        base_url: https://api.gdeltproject.org/api/v2/doc/doc
        mode: artlist
        format: json
        timespan: 48h
        maxrecords: 50
        sort: datedesc
pipeline:
  steps:
  - task: news.gdelt.fetch_articles
    params:
      query: ("consumer spending" OR "retail sales" OR "credit card debt" OR "household debt" OR "discretionary
        spending" OR "consumer confidence")
      max_records: 50
  - task: news.filter_articles
    params:
      language: English
  - task: news.dedupe_articles
    params:
      dedupe_strategy: title
  - task: news.tag_articles
  - task: news.aggregate_features
  - task: news.store_features
  - task: news.store_articles
    params:
      output_path: warehouse/normalized/news/articles.jsonl
