name: energy

providers:
  news:
    gdelt:
      timeout_s: 30
      doc:
        base_url: "https://api.gdeltproject.org/api/v2/doc/doc"
        mode: "artlist"
        format: "json"
        timespan: "48h"
        maxrecords: 50
        sort: "datedesc"

pipeline:
  ingest:
    source: gdelt_docs
    query: "(\"oil prices\" OR \"crude oil\" OR OPEC OR \"natural gas\" OR \"energy markets\" OR refinery OR \"LNG exports\")"
    max_records: 50

  transform:
    - type: filter_articles
      language: "English"

    - type: dedupe_articles
      dedupe_strategy: "title"

    - type: store_articles
      output_path: "data/processed/articles/articles.jsonl"
