name: healthcare-biotech

providers:
  news:
    gdelt:
      timeout_s: 30
      doc:
        base_url: "https://api.gdeltproject.org/api/v2/doc/doc"
        mode: "artlist"
        format: "json"
        timespan: "48h"
        maxrecords: 50
        sort: "datedesc"

pipeline:
  ingest:
    source: gdelt_docs
    query: "(biotech OR pharmaceutical OR \"healthcare sector\" OR \"FDA approval\" OR \"drug development\" OR \"clinical trial\")"
    max_records: 50

  transform:
    - type: filter_articles
      language: "English"

    - type: dedupe_articles
      dedupe_strategy: "title"

    - type: tag_articles

    - type: aggregate_article_features

    - type: store_features

    - type: store_articles
      output_path: "data/processed/articles/articles.jsonl"
