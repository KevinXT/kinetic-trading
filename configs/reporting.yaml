# Reporting / BI layer config for the Looker Studio dashboard views.
#
# These BigQuery views summarize the GDELT GKG data for a business-friendly
# dashboard. The public config uses a placeholder project id; supply your real
# one via configs/local.yaml (deep-merged at runtime) or the --project flag.
#
# The views are bounded by a rolling _PARTITIONTIME window (lookback_days) so a
# dashboard querying them only ever scans the recent window, not the whole
# multi-TiB GKG table.

providers:
  bigquery:
    # Overridden by configs/local.yaml at runtime (never commit a real id here).
    project_id: "YOUR_PROJECT_ID"
    # Source GDELT GKG table the reporting views read from.
    table: "gdelt-bq.gdeltv2.gkg_partitioned"

reporting:
  # BigQuery dataset (in your project) where the reporting views are created.
  # Create it once: `bq mk --location=US <project>:kinetic_reporting`.
  dataset: "kinetic_reporting"

  # Rolling window (days) each view scans, and the row cap for the top-N views.
  lookback_days: 30
  top_n: 25

  cost_controls:
    cost_policy_path: "configs/cost_policy.yaml"
    ledger_path: "data/cost/cost_ledger.jsonl"
    # Per-query cap enforced on every dry-run/create (bytes).
    maximum_bytes_billed: 12000000000
    # Typed confirmation required to actually create views with --create.
    # Set to "ENABLE" (or pass --yes on the CLI) to allow creation.
    execute_query: ""
