name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # One distribution, one install. Before 0.2 this step installed seven
      # editable internal packages; see docs/architecture/migration-map.md.
      - name: Install
        run: |
          uv sync --frozen --all-extras
          uv pip install -e .

      # Canonical targets live in the Makefile / scripts/dev so local and CI
      # cannot drift. Dirty-tree checks are release-only and skipped here.
      - name: Validate (lint, imports, format, types, tests, wheel, build pollution)
        run: uv run make validate

      # Live Alpaca test is gated on RUN_PROVIDER_INTEGRATION_TESTS=1 and is
      # skipped unless that variable is explicitly set.
