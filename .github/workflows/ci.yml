name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -e ./packages/common \
            -e ./packages/pipeline_core \
            -e ./packages/news_data \
            -e ./packages/market_data \
            -e ./packages/research_data \
            -e ./packages/strategy_sdk \
            -e ./apps/trading_platform \
            -e ./apps/relevance_annotation_ui \
            -e ".[dev]"

      # Canonical targets live in the Makefile / scripts/dev so local and CI
      # cannot drift. Dirty-tree checks are release-only and skipped here.
      - name: Validate (lint, format, types, tests, wheels, build pollution)
        run: make validate

      # Live Alpaca test is gated on RUN_PROVIDER_INTEGRATION_TESTS=1 and is
      # skipped unless that variable is explicitly set.
