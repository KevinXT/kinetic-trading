name: semiconductors_alpaca_bars
providers:
  market:
    alpaca:
      base_url: https://data.alpaca.markets
      key_id_env: ALPACA_API_KEY_ID
      secret_key_env: ALPACA_API_SECRET_KEY
      timeout_seconds: 30
      maximum_attempts: 4
      initial_backoff_seconds: 1
      maximum_backoff_seconds: 30
      maximum_pages: 100
cache:
  ttl_seconds: null
  force_refresh: false
  schema_version: alpaca-bars-v2
storage:
  type: jsonl
  root: warehouse/normalized/market
pipeline:
  steps:
  - task: market.alpaca.fetch_bars
    params:
      provider: alpaca
      request:
        symbols:
        - AMD
        - NVDA
        - SMH
        - QQQ
        timeframe: 1Day
        start: '2025-05-15T00:00:00Z'
        end: '2026-07-10T23:59:59Z'
        feed: iex
        adjustment: all
        limit: 10000
        sort: asc
        currency: USD
