name: semiconductors_theme_discovery_90d_execute
providers:
  bigquery:
    project_id: YOUR_PROJECT_ID
    table: gdelt-bq.gdeltv2.gkg_partitioned
pipeline:
  steps:
  - task: news.gdelt.bigquery.discover_themes
    params:
      query_name: semiconductors_theme_discovery_90d_partition
      topic: semiconductors
      match_mode: token
      theme_search_patterns:
      - semiconductor
      - semiconductors
      - microelectronics
      - microprocessor
      - microprocessors
      - integrated_circuit
      - integrated_circuits
      - silicon_chip
      - computer_chip
      - chipmaker
      - chipmakers
      - chip_manufacturing
      - wafer_fabrication
      - photolithography
      - fabless
      known_rejected_theme_codes:
      - TAX_FNCACT_FOUNDRYMAN
      partition_filter:
        enabled: true
        column: _PARTITIONTIME
        type: timestamp
      window:
        preset: last_90_days
        bucket: 1d
      limit: 200
      cost_controls:
        dry_run: false
        execute_query: ENABLE
        maximum_bytes_billed: 32000000000
        cost_policy_path: configs/cost_policy.yaml
        ledger_path: warehouse/cost/cost_ledger.jsonl
        use_cache: false
