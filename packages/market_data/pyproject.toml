[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetic-market-data"
version = "0.1.0"
description = "Provider-agnostic financial data contracts and integrations"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "kinetic-common>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
market_data = ["py.typed"]
