[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetic-news-data"
version = "0.1.0"
description = "News data provider integrations (e.g. GDELT)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "kinetic-common>=0.1.0",
  "requests>=2.31",
  # Historical GDELT counts via BigQuery (cost-aware provider path). Imported
  # lazily so the rest of news_data works without it installed.
  "google-cloud-bigquery>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# Ship the reporting SQL templates as package data so the reporting layer works
# in non-editable installs too (editable installs read them straight from src/).
[tool.setuptools.package-data]
"news_data.reporting" = ["sql/*.sql"]
