[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetic-common"
version = "0.1.0"
description = "Shared configuration loading, errors, and utilities for kinetic-trading"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
