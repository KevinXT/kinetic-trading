[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Local workstation app. Install from repo root:
#   pip install -e ./apps/relevance_annotation_ui
# Streamlit is intentionally scoped here, not as a core research-package dependency.

[project]
name = "kinetic-relevance-annotation-ui"
version = "0.1.0"
description = "Local-only semiconductor relevance annotation workstation"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.32",
  "kinetic-research-data>=0.1.0",
  "kinetic-news-data>=0.1.0",
  "PyYAML>=6.0",
]

[tool.setuptools]
py-modules = [
  "app_config",
  "annotation_store",
  "pilot_service",
  "view_models",
]
